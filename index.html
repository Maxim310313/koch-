<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Система</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }
  .time {
    font-size: 72px;
    font-weight: 200;
    margin-bottom: 8px;
  }
  .date {
    font-size: 18px;
    opacity: 0.8;
    margin-bottom: 60px;
  }
  .lock-icon {
    font-size: 32px;
    margin-bottom: 20px;
  }
  .label {
    font-size: 16px;
    margin-bottom: 24px;
    opacity: 0.9;
  }
  .pin {
    display: flex;
    gap: 16px;
    margin-bottom: 40px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border: 2px solid #fff;
    border-radius: 50%;
  }
  .dot.filled { background: #fff; }
  .error {
    color: #ff453a;
    font-size: 14px;
    height: 20px;
    margin-bottom: 20px;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 16px;
  }
  .key {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
  }
  .key:active { background: rgba(255,255,255,0.3); }
  .emergency {
    position: absolute;
    bottom: 40px;
    font-size: 14px;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="time" id="time">12:00</div>
  <div class="date" id="date">1 января</div>
  <div class="lock-icon">🔒</div>
  <div class="label">Введите пароль</div>
  <div class="pin" id="pin">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="error" id="error"></div>
  <div class="keypad" id="keypad"></div>
  <div class="emergency">Экстренный вызов</div>

<script>
  const password = "2288";
  let input = "";
  const dots = document.querySelectorAll(".dot");
  const error = document.getElementById("error");

  function updateTime() {
    const now = new Date();
    document.getElementById("time").textContent = now.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"});
    document.getElementById("date").textContent = now.toLocaleDateString("ru-RU", {weekday: "long", day: "numeric", month: "long"});
  }
  setInterval(updateTime, 1000);
  updateTime();

  const keys = ["1","2","3","4","5","6","7","8","9","", "0", "⌫"];
  const keypad = document.getElementById("keypad");
  keys.forEach(k => {
    const btn = document.createElement("div");
    btn.className = "key";
    btn.textContent = k;
    if (k) btn.onclick = () => press(k);
    keypad.appendChild(btn);
  });

  function press(key) {
    if (key === "⌫") {
      input = input.slice(0, -1);
    } else if (input.length < 4) {
      input += key;
    }
    dots.forEach((d, i) => d.classList.toggle("filled", i < input.length));
    error.textContent = "";
    if (input.length === 4) {
      if (input === password) {
        document.body.innerHTML = "<div style='color:#fff;font-size:24px;text-align:center;padding-top:40vh'>Разблокировано</div>";
      } else {
        error.textContent = "Неверный пароль";
        input = "";
        dots.forEach(d => d.classList.remove("filled"));
      }
    }
  }

  history.pushState(null, null, location.href);
  window.onpopstate = () => history.go(1);
</script>
</body>
</html>
